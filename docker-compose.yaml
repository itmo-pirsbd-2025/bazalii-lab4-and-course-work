services:
  summarizer-postgres:
    image: postgres:16
    container_name: summarizer-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=summarizer
      - POSTGRES_PASSWORD=summarizer
      - POSTGRES_DB=summarization
    volumes:
      - summarizer_postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init/001_schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U summarizer -d summarization" ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  summarizer_postgres_data: